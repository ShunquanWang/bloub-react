name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # npm provenance (OIDC)
  id-token: write

jobs:
  release:
    name: Version or publish bloub-react
    if: ${{ github.repository == 'ShunquanWang/bloub-react' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Create Release Pull Request or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          # Requires: Allow GitHub Actions to create and approve pull requests
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: yarn g:version
          publish-script: yarn g:release
          pr-title: '[Release] Version packages'
          commit-message: 'chore: version packages [skip ci]'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Yarn 4 ignores .npmrc; do NOT set HOME=workspace (breaks Corepack
          # under Node 22 — it re-downloads yarn into the repo .cache as ESM).
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
