name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # npm provenance (OIDC)
  id-token: write
  packages: write

jobs:
  release:
    name: Version or publish bloub-react
    if: ${{ github.repository == 'ShunquanWang/bloub-react' }}
    runs-on: ubuntu-latest
    # make npm token available to all steps in this job
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Needed for changesets changelog comparison
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Configure npm auth
        # ensure the npm token is written to the runner's npm config so publish commands can authenticate
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "ERROR: NPM_TOKEN is not set. Add it to repository secrets (Settings → Secrets → Actions)." >&2
            exit 1
          fi
          # Write token to both the runner's user npmrc and a project .npmrc so different tools pick it up
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          # Also configure npm (some tools read npm config directly)
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          # Optional: prevent accidental token leaks in logs
          chmod 600 ~/.npmrc .npmrc

      - name: Create Release Pull Request or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          # Requires repo setting: Settings → Actions → General →
          # "Allow GitHub Actions to create and approve pull requests"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: yarn g:version
          publish-script: yarn g:release
          pr-title: '[Release] Version packages'
          commit-message: 'chore: version packages [skip ci]'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
